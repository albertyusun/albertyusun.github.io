research_news:
  - date: "September 2026"
    content: 'Our paper, "InvestigationWorlds: An Agentic Environment for Legal Investigation", was accepted as a poster to the NeurIPS 2026 Evaluations and Datasets Track!'
  - date: "August 2026"
    content: 'Our paper, "CorporateBench: Large-Scale Q&A Benchmarking with Temporal Knowledge Bases", was accepted to EMNLP Findings 2026! See you in Budapest.'
  - date: "May 2025"
    content: "I've joined Epiq AI Labs as a Research Engineer to work on building evals for the legal domain. I'll be advised by Igor Labutov and Bishan Yang."
  - date: "March 2024"
    content: 'My first-author paper, "CONSCENDI: A Contrastive and Scenario-Guided Distillation Approach to Guardrail Models for Virtual Assistants", was accepted to NAACL 2024! See you in Mexico City.'
  - date: "March 2023"
    content: "I served as a reviewer for EMNLP 2023."
  - date: "July 2023"
    content: 'We submitted our preprint "Does fine-tuning GPT-3 with the OpenAI API leak personally-identifiable information?" to Arxiv. This was my first project at DynamoFL, and we were first to analyze privacy leakage from OpenAI''s fine-tuning API.'

